name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    name: JavaScript syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check every JavaScript file
        run: |
          fail=0
          for f in algorithms/*.js assets/js/*.js data/*.js; do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: Report
        run: echo "All JavaScript files pass syntax checks — zero-dependency build verified."
